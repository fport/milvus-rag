[project]
name = "milvus-rag"
version = "0.1.0"
description = "A RAG service over a codebase: Azure DevOps / GitHub repo -> tree-sitter chunk -> Milvus (dense + BM25) -> rerank; incremental refresh on push."
readme = "README.md"
# The system Python is 3.14; the stable wheels for torch / pymilvus are on 3.12. uv fetches it itself.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13.9",
    "pymilvus>=2.5",
    "sentence-transformers>=3.3",
    "numpy>=2.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.15.8",
    "anthropic>=1.0",
    "mcp>=2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
    "mypy>=1.13",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
]

[project.scripts]
rag = "milvus_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milvus_rag"]

[tool.uv]
package = true

# torch without CUDA on a Linux server (Docker included): the image shrinks by ~5 GB. macOS is unaffected.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that need Milvus or a model download (run them with RAG_LIVE=1)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]  # ambiguous-unicode warnings on typographic characters

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
