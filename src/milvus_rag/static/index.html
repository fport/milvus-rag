<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b09">
<title>Milvus RAG</title>
<style>
  /* ── Fosfor konsol: koyu tema, neon yeşil tek vurgu, tablo düzeni ───────── */
  :root {
    color-scheme: dark;
    --bg: #070b09;
    --panel: #0d1410;
    --inset: #0a100c;
    --line: #1c2a22;
    --line-2: #2a4033;
    --ink: #dcebe1;
    --muted: #7d9385;
    --faint: #566b5e;
    --neon: #3bf66b;
    --neon-dim: #29b34e;
    --neon-ink: #03150a;
    --neon-soft: rgba(59, 246, 107, .09);
    --glow: rgba(59, 246, 107, .28);
    --warn: #ffc24b;
    --err: #ff6b5e;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--line-2) var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(1000px 560px at 8% -10%, rgba(59,246,107,.09), transparent 62%),
      radial-gradient(1300px 900px at 108% 112%, rgba(28,140,84,.10), transparent 60%),
      radial-gradient(140% 120% at 50% 42%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  .shell { position: relative; z-index: 1; }
  ::selection { background: var(--neon); color: var(--neon-ink); }
  a { color: var(--neon); text-decoration-color: rgba(59,246,107,.4); }
  a:hover { text-decoration-color: var(--neon); }
  :focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; border-radius: 4px; }

  /* ── Kabuk: sol nav + içerik ─────────────────────────────────────────── */
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  nav {
    border-right: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; padding: 18px 14px; gap: 4px;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { font: 700 14px/1 var(--mono); letter-spacing: .08em; padding: 4px 10px 18px; display: flex; gap: 9px; align-items: center; }
  .brand .sig { color: var(--neon); text-shadow: 0 0 12px var(--glow); font-size: 16px; }
  .brand .sub { color: var(--faint); font-weight: 400; }
  nav .item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: 0; border-radius: 9px; padding: 10px 12px;
    font: 600 13px/1 var(--sans); color: var(--muted); cursor: pointer; text-align: left;
    transition: background .12s, color .12s;
  }
  nav .item .ico { font-family: var(--mono); width: 16px; text-align: center; color: var(--faint); }
  nav .item:hover { background: var(--inset); color: var(--ink); }
  nav .item.active { background: var(--neon-soft); color: var(--neon); }
  nav .item.active .ico { color: var(--neon); text-shadow: 0 0 10px var(--glow); }
  nav .item .cnt { margin-left: auto; font: 11px/1 var(--mono); color: var(--faint); }
  /* çekirdek: index evreninin nabzı */
  .core { margin: auto 0 8px; position: relative; height: 190px; display: grid; place-items: center; }
  .core .field { position: relative; width: 150px; height: 150px; }
  .core .orb {
    position: absolute; inset: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #d9ffe6, var(--neon) 42%, #0f5e2a 78%, #062812 100%);
    box-shadow: 0 0 24px var(--glow), 0 0 70px rgba(59,246,107,.18);
    animation: breathe 4.5s ease-in-out infinite;
  }
  .core.busy .orb { animation-duration: 1.2s; }
  @keyframes breathe { 50% { box-shadow: 0 0 34px var(--glow), 0 0 100px rgba(59,246,107,.3); } }
  .core .ring {
    position: absolute; inset: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%);
    border: 1px solid rgba(59,246,107,.5); border-radius: 50%; opacity: 0;
    animation: ping 4.5s linear infinite;
  }
  .core .ring.r2 { animation-delay: 1.5s; }
  .core .ring.r3 { animation-delay: 3s; }
  .core.busy .ring { animation-duration: 1.8s; }
  .core.busy .ring.r2 { animation-delay: .6s; }
  .core.busy .ring.r3 { animation-delay: 1.2s; }
  @keyframes ping { 0% { opacity: .7; } 85% { width: 150px; height: 150px; opacity: 0; } 100% { opacity: 0; } }
  .core .orbitpath { position: absolute; inset: 50%; width: 108px; height: 108px; transform: translate(-50%, -50%); border: 1px dashed rgba(59,246,107,.14); border-radius: 50%; }
  .core .sats { position: absolute; inset: 50%; width: 108px; height: 108px; transform: translate(-50%, -50%); animation: spin 46s linear infinite; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  .core .sat {
    position: absolute; top: 50%; left: 50%; width: 7px; height: 7px; margin: -3.5px;
    border-radius: 50%; background: var(--neon); box-shadow: 0 0 8px var(--glow);
  }
  .corecap { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font: 10.5px/1.5 var(--mono); color: var(--faint); letter-spacing: .06em; }
  nav .foot { margin-top: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px 4px 2px; border-top: 1px solid var(--line); }
  .chip { font: 11px/1.5 var(--mono); color: var(--faint); display: flex; gap: 7px; align-items: center; padding: 2px 8px; }
  .chip::before { content: "●"; font-size: 8px; color: var(--faint); }
  .chip.ok::before { color: var(--neon); }
  .chip.err { color: var(--err); } .chip.err::before { color: var(--err); }

  content, .content { display: block; padding: 34px 44px 80px; max-width: 1160px; margin: 0 auto; width: 100%; }

  /* Görünüm başlığı: sol başlık, sağ tek eylem (Carna'daki Publish gibi) */
  .vhead { display: flex; align-items: center; gap: 14px; margin: 0 0 18px; }
  .vhead h1 { font: 700 17px/1.2 var(--sans); margin: 0; }
  .vhead .sub { color: var(--faint); font: 12px var(--mono); }
  .vhead .spacer { flex: 1; }

  button {
    font: 600 13px/1 var(--sans); border: 1px solid var(--line-2); border-radius: 9px;
    background: var(--panel); color: var(--ink); padding: 9px 15px; cursor: pointer;
    transition: border-color .12s, background .12s, box-shadow .12s, transform .12s;
  }
  button:hover { border-color: var(--neon-dim); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary {
    background: var(--neon); border-color: var(--neon); color: var(--neon-ink);
    font-family: var(--mono); font-weight: 700; box-shadow: 0 0 18px rgba(59,246,107,.22);
  }
  button.primary:hover { transform: translateY(-1px); box-shadow: 0 0 26px rgba(59,246,107,.38); }
  button.quiet { background: none; border-color: transparent; color: var(--muted); padding: 6px 9px; font-weight: 500; font-size: 12.5px; }
  button.quiet:hover { color: var(--ink); border-color: var(--line-2); }
  button.quiet.danger:hover { color: var(--err); border-color: var(--err); }

  /* ── Komut çubuğu (Ara görünümünün kahramanı) ───────────────────────── */
  .cmd {
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, rgba(220,255,235,.025), transparent 50%), var(--panel); box-shadow: 0 18px 50px rgba(0,0,0,.35); border: 1px solid var(--line-2); border-radius: 14px;
    padding: 6px 8px 6px 18px; position: relative;
    transition: border-color .15s, box-shadow .15s;
  }
  .cmd::after {
    content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--neon), transparent);
    background-size: 220% 100%; background-position: -120% 0; background-repeat: no-repeat;
    opacity: 0; transition: opacity .2s;
  }
  .cmd:focus-within { border-color: var(--neon-dim); box-shadow: 0 0 0 1px rgba(59,246,107,.25), 0 0 28px rgba(59,246,107,.12); }
  .cmd:focus-within::after { opacity: 1; animation: sweep 1.6s ease-out; background-position: 120% 0; }
  @keyframes sweep { from { background-position: -120% 0; } }
  .cmd .prompt { font: 700 22px/1 var(--mono); color: var(--neon); text-shadow: 0 0 14px var(--glow); user-select: none; }
  .cmd input { flex: 1; min-width: 0; border: 0; background: none; color: var(--ink); font: 16px/1.4 var(--mono); padding: 14px 0; caret-color: var(--neon); }
  .cmd input::placeholder { color: var(--faint); }
  .cmd input:focus { outline: none; }
  .cmd .actions { display: flex; gap: 8px; flex: none; }

  .deckrow { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; margin: 12px 2px 0; }
  .try { font: 10.5px/1 var(--mono); color: var(--faint); letter-spacing: .12em; }
  .exq { font: 12px/1 var(--mono); color: var(--muted); background: none; border: 1px dashed var(--line-2); border-radius: 999px; padding: 7px 12px; font-weight: 400; }
  .exq:hover { color: var(--neon); border-color: var(--neon-dim); border-style: solid; }
  details.adv { margin-left: auto; }
  details.adv summary { cursor: pointer; list-style: none; font: 11px/1 var(--mono); letter-spacing: .1em; color: var(--faint); padding: 7px 4px; }
  details.adv summary::before { content: "⚙ "; }
  details.adv[open] summary { color: var(--neon); }
  .advbody {
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; margin-top: 10px; font-size: 12.5px; color: var(--muted); width: 100%;
  }
  .advbody label { margin-right: 6px; }
  select, input[type=number] { background: var(--inset); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; font: 12.5px var(--sans); }
  .repofilter { display: flex; flex-wrap: wrap; gap: 10px; }
  .repofilter label { display: inline-flex; gap: 5px; align-items: center; margin: 0; }
  input[type=checkbox] { accent-color: var(--neon); width: 14px; height: 14px; }

  /* ── Tablo (Repolar) ─────────────────────────────────────────────────── */
  .card { background: linear-gradient(180deg, rgba(220,255,235,.02), transparent 45%), var(--panel); border: 1px solid var(--line); border-radius: 13px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
  table { width: 100%; border-collapse: collapse; }
  th { font: 600 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  td { padding: 13px 14px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
  tbody tr:last-child > td { border-bottom: 0; }
  tbody tr.mainrow:hover { background: var(--inset); }
  td.cname { font: 600 13px var(--mono); white-space: nowrap; }
  td .led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 9px; background: var(--faint); vertical-align: 1px; }
  .led.ready { background: var(--neon); box-shadow: 0 0 8px var(--glow); }
  .led.indexing { background: var(--warn); box-shadow: 0 0 8px rgba(255,194,75,.5); animation: pulse 1.1s ease-in-out infinite; }
  .led.error { background: var(--err); box-shadow: 0 0 8px rgba(255,107,94,.5); }
  @keyframes pulse { 50% { opacity: .35; } }
  td.dim { color: var(--muted); font: 12px var(--mono); }
  td.num { color: var(--muted); font: 12px var(--mono); text-align: right; }
  .st { font: 12px var(--mono); }
  .st.ready { color: var(--neon); } .st.indexing { color: var(--warn); } .st.error { color: var(--err); } .st.pending { color: var(--muted); }
  td.acts { text-align: right; white-space: nowrap; }
  td.acts a { font-size: 12.5px; margin: 0 4px; }
  tr.subrow td { padding: 0 14px 12px; border-bottom: 1px solid var(--line); }
  tr.subrow .bar { margin: 0 0 6px; }
  .bar { height: 5px; border-radius: 3px; background: var(--inset); border: 1px solid var(--line); overflow: hidden; }
  .bar > div { height: 100%; background: var(--neon); box-shadow: 0 0 10px var(--glow); transition: width .5s; }
  .errtxt { color: var(--err); font-size: 12.5px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 12px; }

  /* Repo bağla paneli */
  .addcard { background: var(--panel); border: 1px solid var(--line-2); border-radius: 13px; padding: 18px; margin-bottom: 16px; }
  .addcard h3 { margin: 0 0 4px; font: 700 14px var(--sans); }
  .addcard .note { color: var(--faint); font-size: 12.5px; margin: 0 0 12px; }
  .addgrid { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .addgrid > div { min-width: 180px; flex: 1; }
  .addgrid label { font: 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); display: block; margin-bottom: 6px; }
  .addgrid input, .addgrid select { width: 100%; background: var(--inset); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 13px var(--mono); }
  .addgrid input:focus, .addgrid select:focus { outline: none; border-color: var(--neon-dim); box-shadow: 0 0 0 1px rgba(59,246,107,.25); }
  .addgrid .btns { display: flex; gap: 8px; flex: none; }

  .starter { padding: 34px 20px; text-align: center; color: var(--muted); }
  .starter .steps { font: 13px/2 var(--sans); }
  .starter b { color: var(--ink); }

  .empty { color: var(--muted); padding: 30px 12px; text-align: center; font-size: 13.5px; }

  /* ── Sonuçlar ────────────────────────────────────────────────────────── */
  .timing { color: var(--muted); font: 12px var(--mono); margin: 14px 2px 2px; }
  .timing b { color: var(--neon); font-weight: 600; }
  .hit { border: 1px solid var(--line); background: var(--panel); border-radius: 11px; margin-top: 10px; overflow: hidden; animation: rise .25s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  .hit .head { display: flex; gap: 8px 10px; align-items: baseline; padding: 10px 14px; cursor: pointer; flex-wrap: wrap; }
  .hit .head:hover .path { color: var(--neon); }
  .hit .path { font: 600 12.5px var(--mono); overflow-wrap: anywhere; transition: color .12s; }
  .hit .sym { color: var(--muted); font-size: 12px; }
  .badge { font: 10.5px/1.6 var(--mono); background: var(--neon-soft); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--muted); }
  .hit pre, .job pre { margin: 0; padding: 12px 14px; background: var(--bg); font: 12px/1.5 var(--mono); overflow-x: auto; border-top: 1px solid var(--line); max-height: 132px; max-width: 100%; }
  .hit.open pre { max-height: none; }
  .answer { white-space: pre-wrap; background: var(--neon-soft); border: 1px solid var(--line-2); border-radius: 11px; padding: 14px 16px; margin-top: 12px; font-size: 13.5px; }
  .srcs { font: 12px/1.8 var(--mono); color: var(--muted); margin-top: 10px; }

  /* ── İşler ───────────────────────────────────────────────────────────── */
  .opts { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 0 0 8px; font-size: 12.5px; color: var(--muted); }
  .job { border: 1px solid var(--line); background: var(--panel); border-radius: 11px; padding: 12px 14px; margin-top: 10px; }
  .job .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .job .head b { font: 600 13px var(--mono); }
  .job .when { color: var(--faint); font: 11.5px var(--mono); margin-left: auto; }
  .badge.st-done { color: var(--neon); border-color: rgba(59,246,107,.3); }
  .badge.st-failed { color: var(--err); border-color: rgba(255,107,94,.35); }
  .badge.st-running, .badge.st-queued { color: var(--warn); border-color: rgba(255,194,75,.35); }
  .badge.trigger-webhook { color: var(--neon); }
  .badge.trigger-poll { color: var(--warn); }
  .flow { display: flex; gap: 7px; align-items: stretch; flex-wrap: wrap; margin-top: 10px; }
  .step { background: var(--inset); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; min-width: 92px; }
  .step small { display: block; font: 10px/1.6 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .step b { display: block; font: 600 12.5px/1.5 var(--mono); }
  .arrow { align-self: center; color: var(--neon-dim); font-family: var(--mono); }
  .job .errtxt { margin-top: 8px; }
  .job details { margin-top: 8px; }
  .job summary { font: 11px var(--mono); color: var(--faint); cursor: pointer; }
  .job details pre { border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; }

  /* ── Bağlan ──────────────────────────────────────────────────────────── */
  .connect h3 { font: 700 13px var(--mono); margin: 24px 0 8px; }
  .connect h3:first-of-type { margin-top: 6px; }
  .connect h3 .no { color: var(--neon); text-shadow: 0 0 10px var(--glow); margin-right: 6px; }
  .connect p, .connect li { font-size: 13.5px; }
  .connect .note { color: var(--muted); font-size: 12.5px; }
  .connect code { font: 12px var(--mono); color: var(--ink); background: var(--inset); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  .warnbox { border: 1px solid rgba(255,194,75,.5); background: rgba(255,194,75,.07); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin: 4px 0 14px; }
  .copyrow { display: flex; gap: 10px; align-items: center; background: var(--inset); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; margin: 8px 0; }
  .copyrow code { flex: 1; white-space: pre; overflow-x: auto; font: 12px/1.6 var(--mono); background: none; border: 0; padding: 0; color: var(--ink); }
  .copyrow button { flex: none; font: 600 11px var(--mono); padding: 5px 10px; color: var(--neon); }

  /* kimlik + repo seçici */
  .credzone { margin: 2px 0 14px; }
  .credline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .credline .okmark { color: var(--neon); font-family: var(--mono); }
  .minigrid { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-top: 10px; }
  .minigrid > div { flex: 1; min-width: 200px; }
  .minigrid label { font: 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); display: block; margin-bottom: 6px; }
  .minigrid input { width: 100%; background: var(--inset); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 13px var(--mono); }
  .minigrid input:focus { outline: none; border-color: var(--neon-dim); box-shadow: 0 0 0 1px rgba(59,246,107,.25); }
  .pick { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; max-height: 240px; overflow: auto; background: var(--inset); }
  .pickrow { display: flex; gap: 10px; align-items: center; padding: 9px 13px; border-bottom: 1px solid var(--line); cursor: pointer; font: 12.5px var(--mono); }
  .pickrow:last-child { border-bottom: 0; }
  .pickrow:hover { background: var(--neon-soft); }
  .pickrow .dim2 { color: var(--faint); font-size: 11.5px; }
  .pickrow .right { margin-left: auto; color: var(--faint); font-size: 11px; }
  .pickrow.taken { opacity: .5; cursor: default; }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #2a1210; border: 1px solid var(--err); color: #ffd9d5;
    padding: 10px 16px; border-radius: 10px; font-size: 13px; max-width: 90vw; display: none; z-index: 10;
  }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    nav { position: static; height: auto; flex-direction: row; align-items: center; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { padding-bottom: 4px; width: 100%; }
    nav .item { width: auto; }
    nav .foot { display: none; }
    .content { padding: 18px 16px 50px; }
    td.dim, td.num, th.hides { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav>
    <div class="brand"><span class="sig">❯</span> MILVUS<span class="sub">//</span>RAG</div>
    <button class="item" id="tabbtn-ara" onclick="showTab('ara')"><span class="ico">❯</span> Ara</button>
    <button class="item" id="tabbtn-repolar" onclick="showTab('repolar')"><span class="ico">▤</span> Repolar <span class="cnt" id="repoCount"></span></button>
    <button class="item" id="tabbtn-isler" onclick="showTab('isler')"><span class="ico">⟲</span> İşler</button>
    <button class="item" id="tabbtn-baglan" onclick="showTab('baglan')"><span class="ico">⇄</span> Bağlan</button>
    <div class="core" id="core" aria-hidden="true">
      <div class="field">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
        <div class="orbitpath"></div>
        <div class="sats" id="coreSats"></div>
        <div class="orb"></div>
      </div>
      <div class="corecap" id="coreCap"></div>
    </div>
    <div class="foot" id="chips"></div>
  </nav>

  <div class="content">
    <!-- ── Ara ─────────────────────────────────────────────────────────── -->
    <div id="tab-ara">
      <div class="cmd">
        <span class="prompt" aria-hidden="true">❯</span>
        <input id="q" placeholder="Soru yaz ya da fonksiyon adı yapıştır…" autofocus aria-label="Kod tabanında ara">
        <div class="actions">
          <button class="primary" id="btnSearch">Ara</button>
          <button id="btnAsk" title="Bulunan kodla AI'dan atıflı cevap ister">AI'ya sor</button>
        </div>
      </div>
      <div class="deckrow">
        <span class="try">DENE</span>
        <button class="exq" onclick="tryQuery(this)">jwt token nerede üretiliyor</button>
        <button class="exq" onclick="tryQuery(this)">withSession</button>
        <button class="exq" onclick="tryQuery(this)">webhook eventleri nasıl kuyruğa alınıyor</button>
        <details class="adv">
          <summary>Ayarlar</summary>
          <div class="advbody">
            <span><label for="mode">arama modu</label><select id="mode">
              <option value="">Otomatik (önerilen)</option>
              <option value="dense">Anlamsal</option>
              <option value="bm25">Kelime (BM25)</option>
              <option value="hybrid">Karma (RRF)</option>
            </select></span>
            <span><label for="k">sonuç</label><input id="k" type="number" value="8" min="1" max="50" style="width:64px"></span>
            <span><label for="rr">yeniden sırala</label><input id="rr" type="checkbox" title="Cross-encoder; daha isabetli ama saniyeler sürer"></span>
            <span class="repofilter" id="repoFilter"></span>
          </div>
        </details>
      </div>
      <div id="out"><div class="empty">Yaz, Enter'a bas — o kadar.</div></div>
    </div>

    <!-- ── Repolar ─────────────────────────────────────────────────────── -->
    <div id="tab-repolar" hidden>
      <div class="vhead">
        <h1>Repolar</h1><span class="sub" id="repoSub"></span>
        <span class="spacer"></span>
        <button class="primary" id="btnAddRepo">＋ Repo bağla</button>
      </div>
      <div class="addcard" id="addBox" hidden>
        <h3>Repo bağla</h3>
        <p class="note">Bağlanınca klonlanır ve indexlenir; sonrasında her push'ta yalnızca değişen dosyalar güncellenir.</p>
        <div class="credzone" id="credZone"></div>
        <div class="addgrid">
          <div style="flex:0 0 170px"><label for="aProvider">Nereden</label>
            <select id="aProvider">
              <option value="github">GitHub</option>
              <option value="azure">Azure DevOps</option>
              <option value="local">Sunucudaki dizin</option>
              <option value="git">Git URL</option>
            </select></div>
          <div id="fGithub"><label for="aGh">owner/repo</label><input id="aGh" placeholder="örn: vercel/next.js"></div>
          <div id="fAzure" hidden><label for="aProj">Proje</label><input id="aProj" placeholder="Platform"></div>
          <div id="fAzure2" hidden><label for="aRepo">Repo adı</label><input id="aRepo" placeholder="backend-api"></div>
          <div id="fLocal" hidden><label for="aPath">Dizin yolu</label><input id="aPath" placeholder="/opt/repos/my-api"></div>
          <div id="fGit" hidden><label for="aUrl">Clone URL</label><input id="aUrl" placeholder="https://…/repo.git"></div>
          <div style="flex:0 0 140px"><label for="aBranch">Branch</label><input id="aBranch" placeholder="varsayılan"></div>
          <div class="btns">
            <button class="primary" id="aSubmit">Bağla & indexle</button>
            <button class="quiet" id="aCancel">Vazgeç</button>
          </div>
        </div>
        <div id="pickZone"></div>
      </div>
      <div class="card"><div id="repos"><div class="empty">yükleniyor…</div></div></div>
    </div>

    <!-- ── İşler ───────────────────────────────────────────────────────── -->
    <div id="tab-isler" hidden>
      <div class="vhead">
        <h1>Index işleri</h1><span class="sub">4 sn'de bir yenilenir</span>
        <span class="spacer"></span>
        <span class="opts"><label for="jobRepo">repo</label> <select id="jobRepo" onchange="loadJobs()"><option value="">hepsi</option></select></span>
      </div>
      <div id="jobs"><div class="empty">yükleniyor…</div></div>
    </div>

    <!-- ── Bağlan ──────────────────────────────────────────────────────── -->
    <div id="tab-baglan" hidden class="connect">
      <div class="vhead"><h1>Bağlan</h1><span class="sub">webhook · API · MCP</span></div>
      <div id="connect"><div class="empty">yükleniyor…</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="alert"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let repos = [];

const STATUS_TR = { ready: "hazır", indexing: "indexleniyor", error: "hata", pending: "bekliyor" };

function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.style.display = "block";
  clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 6000);
}
async function api(path, options) {
  const res = await fetch(path, options);
  const text = await res.text();
  let data; try { data = JSON.parse(text); } catch { data = { detail: text }; }
  if (!res.ok) throw new Error(data.detail?.[0]?.msg || data.detail || res.status);
  return data;
}
function tryQuery(btn) { $("q").value = btn.textContent; doSearch(); }

// ---------------------------------------------------------------- sağlık
async function loadHealth() {
  try {
    const h = (window._health = await api("/health"));
    if (!$("tab-baglan").hidden) renderConnect();
    $("chips").innerHTML =
      `<span class="chip ${h.milvus ? "ok" : "err"}">milvus</span>` +
      `<span class="chip ok">${esc(h.embedding.split("/").pop())}</span>` +
      `<span class="chip ${h.llm ? "ok" : ""}">${h.llm ? esc(h.llm) : "LLM kapalı"}</span>`;
  } catch (e) { $("chips").innerHTML = `<span class="chip err">servis yok</span>`; }
}

// ---------------------------------------------------------------- repolar
function repoRow(r) {
  const job = r.active_job;
  const p = job?.stats?.progress;
  const pct = p && p.files_total ? Math.round(100 * p.files_done / p.files_total) : null;
  const state = job ? "indexing" : r.status;
  const when = r.last_indexed_at ? r.last_indexed_at.slice(5, 16).replace("T", " ") : "—";
  let sub = "";
  if (job) {
    sub = `<tr class="subrow"><td colspan="8">
      <div class="bar"><div style="width:${pct ?? 5}%"></div></div>
      <div class="meta">${job.status === "running" ? (pct !== null ? `indexleniyor — ${p.files_done}/${p.files_total} dosya` : "indexleniyor…") : "sırada bekliyor"}</div>
    </td></tr>`;
  } else if (r.status === "error") {
    sub = `<tr class="subrow"><td colspan="8"><div class="errtxt">${esc(r.error)}</div></td></tr>`;
  }
  return `<tr class="mainrow">
    <td class="cname"><span class="led ${esc(state)}"></span>${esc(r.name)}</td>
    <td class="dim">${esc(r.provider)}</td>
    <td><span class="st ${esc(state)}">${STATUS_TR[state] ?? esc(state)}</span></td>
    <td class="num">${r.file_count}</td>
    <td class="num">${r.chunk_count}</td>
    <td class="dim">${esc(r.branch || "—")}</td>
    <td class="dim">${esc(when)}</td>
    <td class="acts">
      <button class="quiet" onclick="syncRepo('${esc(r.id)}')" ${job ? "disabled" : ""} title="Değişen dosyaları şimdi tara">Güncelle</button>
      ${r.web_url ? `<a href="${esc(r.web_url)}" target="_blank" rel="noopener">↗</a>` : ""}
      <button class="quiet danger" onclick="removeRepo('${esc(r.id)}')" ${job ? "disabled" : ""}>Kaldır</button>
    </td>
  </tr>${sub}`;
}
const STARTER = `<div class="starter">
  <div class="steps"><b>1</b> — Sağ üstten repo bağla &nbsp;·&nbsp; <b>2</b> — index'in bitmesini bekle &nbsp;·&nbsp; <b>3</b> — Ara'ya geç, soruyu sor</div>
</div>`;
async function loadRepos() {
  try {
    repos = await api("/repos");
    $("repoCount").textContent = repos.length || "";
    $("repoSub").textContent = repos.length
      ? `${repos.length} repo · ${repos.reduce((n, r) => n + r.chunk_count, 0)} chunk`
      : "";
    if (repos.length) {
      $("repos").innerHTML = `<table>
        <thead><tr><th>Repo</th><th>Tür</th><th>Durum</th><th class="hides" style="text-align:right">Dosya</th><th class="hides" style="text-align:right">Chunk</th><th class="hides">Branch</th><th class="hides">Güncellendi</th><th></th></tr></thead>
        <tbody>${repos.map(repoRow).join("")}</tbody></table>`;
    } else {
      $("repos").innerHTML = STARTER;
      $("addBox").hidden = false;
    }
    $("repoFilter").innerHTML = repos.length < 2 ? "" : `<label style="color:var(--faint)">repolar:</label>` + repos.map(r =>
      `<label><input type="checkbox" value="${esc(r.id)}" checked> ${esc(r.id)}</label>`).join("");
    const jobSel = $("jobRepo");
    if (jobSel) {
      const current = jobSel.value;
      jobSel.innerHTML = `<option value="">hepsi</option>` + repos.map(r => `<option>${esc(r.id)}</option>`).join("");
      jobSel.value = current;
    }
    renderCore();
    if (repos.some(r => r.active_job)) setTimeout(loadRepos, 3000);
  } catch (e) { toast("repolar yüklenemedi: " + e.message); }
}
function renderCore() {
  const busy = repos.some(r => r.active_job);
  $("core").classList.toggle("busy", busy);
  const n = Math.min(repos.length, 10);
  $("coreSats").innerHTML = Array.from({ length: n }, (_, i) => {
    const angle = (360 / n) * i;
    return `<span class="sat" style="transform: rotate(${angle}deg) translateX(54px)"></span>`;
  }).join("");
  const chunks = repos.reduce((sum, r) => sum + r.chunk_count, 0);
  $("coreCap").textContent = busy ? "indexleniyor…" : (chunks ? `${chunks.toLocaleString("tr")} chunk canlı` : "çekirdek boşta");
}
async function syncRepo(id) {
  try { await api(`/repos/${id}/sync`, { method: "POST", headers: {"content-type": "application/json"}, body: "{}" }); loadRepos(); }
  catch (e) { toast(e.message); }
}
async function removeRepo(id) {
  if (!confirm(`${id} kaldırılsın mı? Index'i ve klonu silinir.`)) return;
  try { await api(`/repos/${id}`, { method: "DELETE" }); loadRepos(); } catch (e) { toast(e.message); }
}
let credState = null;
async function loadCredState() {
  try { credState = await api("/settings/credentials"); } catch { credState = null; }
  renderCredZone();
}
async function saveCreds(fields, btn) {
  btn.disabled = true; btn.textContent = "doğrulanıyor…";
  try {
    const r = await api("/settings/credentials", {
      method: "PUT", headers: {"content-type": "application/json"},
      body: JSON.stringify({ ...fields, verify: true }),
    });
    if (r.github) toast(r.github.ok ? `GitHub bağlandı: ${r.github.login} ✓` : "GitHub: " + r.github.detail);
    if (r.azure) toast(r.azure.ok ? `Azure bağlandı: ${r.azure.projects} proje ✓` : "Azure: " + r.azure.detail);
    if (!r.github && !r.azure) toast("Kaydedildi");
    await loadCredState(); loadHealth();
  } catch (e) { toast(e.message); }
  finally { btn.disabled = false; btn.textContent = btn.dataset.label; }
}
function renderCredZone() {
  const v = $("aProvider").value;
  const zone = $("credZone");
  $("pickZone").innerHTML = "";
  if (v === "github") {
    const g = credState?.github;
    zone.innerHTML = g?.token_set
      ? `<div class="credline"><span class="okmark">●</span> GitHub token kayıtlı (${g.source === "ui" ? "arayüzden" : "env"}) — private repolar da görünür.
           <button class="quiet" onclick="toggleGhToken()">değiştir</button></div>
         <div class="minigrid" id="ghTokenForm" hidden></div>
         <div class="minigrid">
           <div><label>Repoları listele — kullanıcı ya da org</label><input id="ghOwner" placeholder="örn: fport"></div>
           <div style="flex:0 0 auto"><button data-label="Listele" onclick="listGithub(this)">Listele</button></div>
         </div>`
      : `<div class="credline">Token yok — public repolar yine bağlanır. Private için:
           <button class="quiet" onclick="toggleGhToken()">token ekle</button></div>
         <div class="minigrid" id="ghTokenForm" hidden></div>
         <div class="minigrid">
           <div><label>Repoları listele — kullanıcı ya da org</label><input id="ghOwner" placeholder="örn: fport"></div>
           <div style="flex:0 0 auto"><button data-label="Listele" onclick="listGithub(this)">Listele</button></div>
         </div>`;
  } else if (v === "azure") {
    const a = credState?.azure;
    zone.innerHTML = a?.configured
      ? `<div class="credline"><span class="okmark">●</span> Azure bağlı: ${esc(a.org_url)} (${a.source === "ui" ? "arayüzden" : "env"})
           <button class="quiet" onclick="toggleAzForm()">değiştir</button>
           <button data-label="Projeleri listele" onclick="listAzure(this)">Projeleri listele</button></div>
         <div class="minigrid" id="azForm" hidden></div>`
      : `<div class="credline">Azure bağlı değil — organizasyon adresi ve PAT gerekli (kapsam: Code → Read).</div>
         <div class="minigrid" id="azForm">
           <div><label>Organizasyon URL</label><input id="azOrg" placeholder="https://dev.azure.com/sirket" value="${esc(a?.org_url || "")}"></div>
           <div><label>Personal Access Token</label><input id="azPat" type="password" placeholder="PAT"></div>
           <div style="flex:0 0 auto"><button class="primary" data-label="Kaydet & doğrula" onclick="saveAzure(this)">Kaydet & doğrula</button></div>
         </div>`;
  } else {
    zone.innerHTML = "";
  }
}
function toggleGhToken() {
  const form = $("ghTokenForm");
  form.hidden = !form.hidden;
  if (!form.hidden) form.innerHTML = `
    <div><label>GitHub token (fine-grained, Contents: Read)</label><input id="ghTok" type="password" placeholder="github_pat_… ya da ghp_…"></div>
    <div style="flex:0 0 auto"><button class="primary" data-label="Kaydet & doğrula" onclick="saveCreds({ github_token: $('ghTok').value }, this)">Kaydet & doğrula</button></div>
    <div style="flex:0 0 auto"><button class="quiet" data-label="Sil" onclick="saveCreds({ github_token: '' }, this)">Sil</button></div>`;
}
function toggleAzForm() {
  const form = $("azForm");
  form.hidden = !form.hidden;
  if (!form.hidden) form.innerHTML = `
    <div><label>Organizasyon URL</label><input id="azOrg" placeholder="https://dev.azure.com/sirket" value="${esc(credState?.azure?.org_url || "")}"></div>
    <div><label>Personal Access Token</label><input id="azPat" type="password" placeholder="PAT"></div>
    <div style="flex:0 0 auto"><button class="primary" data-label="Kaydet & doğrula" onclick="saveAzure(this)">Kaydet & doğrula</button></div>
    <div style="flex:0 0 auto"><button class="quiet" data-label="Sil" onclick="saveCreds({ azure_org_url: '', azure_pat: '' }, this)">Sil</button></div>`;
}
function saveAzure(btn) { saveCreds({ azure_org_url: $("azOrg").value, azure_pat: $("azPat").value }, btn); }
async function listGithub(btn) {
  const owner = $("ghOwner").value.trim();
  if (!owner) { $("ghOwner").focus(); return; }
  btn.disabled = true; btn.textContent = "yükleniyor…";
  try {
    const rows = await api(`/github/${encodeURIComponent(owner)}/repos`);
    renderPicks(rows.map(r => ({
      title: r.full_name, sub: r.private ? "private 🔒" : "public", right: r.default_branch,
      taken: r.registered_as, fill: () => { $("aGh").value = r.full_name; $("aBranch").placeholder = r.default_branch; },
    })));
  } catch (e) { toast(e.message); }
  finally { btn.disabled = false; btn.textContent = btn.dataset.label; }
}
async function listAzure(btn) {
  btn.disabled = true; btn.textContent = "yükleniyor…";
  try {
    const projects = await api("/azure/projects");
    renderPicks(projects.map(pr => ({
      title: pr.name, sub: "proje", right: "repoları aç →",
      fill: () => listAzureRepos(pr.name),
    })));
  } catch (e) { toast(e.message); }
  finally { btn.disabled = false; btn.textContent = btn.dataset.label; }
}
async function listAzureRepos(project) {
  try {
    const rows = await api(`/azure/projects/${encodeURIComponent(project)}/repos`);
    renderPicks(rows.map(r => ({
      title: r.name, sub: project, right: r.default_branch,
      taken: r.registered_as, fill: () => { $("aProj").value = project; $("aRepo").value = r.name; $("aBranch").placeholder = r.default_branch; },
    })));
  } catch (e) { toast(e.message); }
}
function renderPicks(items) {
  window._picks = items;
  $("pickZone").innerHTML = items.length
    ? `<div class="pick">` + items.map((it, i) => `
        <div class="pickrow${it.taken ? " taken" : ""}" onclick="pickItem(${i})" title="${it.taken ? "zaten bağlı: " + esc(it.taken) : "Seç"}">
          <span>${esc(it.title)}</span><span class="dim2">${esc(it.sub)}</span>
          <span class="right">${it.taken ? "bağlı ✓" : esc(it.right)}</span>
        </div>`).join("") + `</div>`
    : `<div class="empty">Liste boş.</div>`;
}
function pickItem(i) { const it = window._picks[i]; if (!it.taken) it.fill(); }

$("btnAddRepo").onclick = () => {
  $("addBox").hidden = !$("addBox").hidden;
  if (!$("addBox").hidden) { loadCredState(); $("aGh").focus(); }
};
$("aCancel").onclick = () => { $("addBox").hidden = true; };
$("aProvider").onchange = () => {
  const v = $("aProvider").value;
  $("fGithub").hidden = v !== "github";
  $("fAzure").hidden = $("fAzure2").hidden = v !== "azure";
  $("fLocal").hidden = v !== "local";
  $("fGit").hidden = v !== "git";
  renderCredZone();
};
$("aSubmit").onclick = async () => {
  const provider = $("aProvider").value;
  const body = { provider, branch: $("aBranch").value || null, index_now: true };
  if (provider === "github") body.repo = $("aGh").value.trim();
  if (provider === "azure") { body.project = $("aProj").value.trim(); body.repo = $("aRepo").value.trim(); }
  if (provider === "local") body.path = $("aPath").value.trim();
  if (provider === "git") body.url = $("aUrl").value.trim();
  $("aSubmit").disabled = true;
  try {
    await api("/repos", { method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body) });
    $("addBox").hidden = true; loadRepos();
  } catch (e) { toast(e.message); } finally { $("aSubmit").disabled = false; }
};

// ------------------------------------------------------------------ arama
function searchBody() {
  const boxes = [...document.querySelectorAll("#repoFilter input:checked")].map(el => el.value);
  return {
    q: $("q").value.trim(),
    repo_ids: boxes.length === repos.length ? [] : boxes,
    k: parseInt($("k").value) || 8,
    mode: $("mode").value || null,
    rerank: $("rr").checked ? true : null,
  };
}
function scoreBadges(scores) {
  return Object.entries(scores).map(([k, v]) =>
    `<span class="badge">${k}=${k === "bm25" ? v.toFixed(2) : v.toFixed(3)}</span>`).join(" ");
}
async function doSearch() {
  const body = searchBody();
  if (!body.q) { $("q").focus(); return; }
  showTab("ara");
  $("out").innerHTML = `<div class="empty">aranıyor…</div>`;
  try {
    const d = await api("/search", { method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body) });
    const t = Object.entries(d.timings_ms).map(([k, v]) => `${k} ${Math.round(v)}ms`).join(" · ");
    const head = `<div class="timing">${d.hits.length} sonuç · mod <b>${esc(d.mode)}</b>${d.reranked ? " + rerank" : ""} · ${t}${d.cached ? " · önbellek" : ""}</div>`;
    if (!d.hits.length) {
      $("out").innerHTML = head + `<div class="empty">Eşleşme yok — sorguyu değiştirip tekrar dene.</div>`;
      return;
    }
    $("out").innerHTML = head + d.hits.map(h => `
      <div class="hit" onclick="this.classList.toggle('open')" title="Aç/kapa">
        <div class="head">
          <span class="path">${esc(h.path)}:${h.start_line}-${h.end_line}</span>
          ${h.symbol ? `<span class="sym">${esc(h.kind)} <b>${esc(h.symbol)}</b>${h.parent_symbol ? " · " + esc(h.parent_symbol) : ""}</span>` : ""}
          <span class="badge">${esc(h.repo_id)}</span> ${scoreBadges(h.scores)}
        </div>
        <pre>${esc(h.content)}</pre>
      </div>`).join("");
  } catch (e) { $("out").innerHTML = ""; toast(e.message); }
}
async function doAsk() {
  const body = searchBody();
  if (!body.q) { $("q").focus(); return; }
  showTab("ara");
  $("out").innerHTML = `<div class="empty">AI okuyor… birkaç saniye</div>`;
  try {
    const d = await api("/ask", { method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body) });
    $("out").innerHTML =
      `<div class="timing">${esc(d.model)} · ${Math.round(d.elapsed_ms)}ms</div>` +
      `<div class="answer">${esc(d.answer)}</div>` +
      `<div class="srcs">${d.sources.map(s => `[${s.n}] ${esc(s.path)}:${s.start_line}-${s.end_line}`).join("<br>")}</div>`;
  } catch (e) { $("out").innerHTML = ""; toast(e.message); }
}
$("btnSearch").onclick = doSearch;
$("btnAsk").onclick = doAsk;
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });

// ---------------------------------------------------------------- görünümler
function showTab(name) {
  for (const tab of ["ara", "repolar", "isler", "baglan"]) {
    $("tab-" + tab).hidden = tab !== name;
    $("tabbtn-" + tab).classList.toggle("active", tab === name);
  }
  clearInterval(window._jobsTimer);
  if (name === "isler") { loadJobs(); window._jobsTimer = setInterval(loadJobs, 4000); }
  if (name === "baglan") renderConnect();
  if (name === "repolar") loadRepos();
}

// ------------------------------------------------------------------ işler
function step(title, main, sub) {
  return `<div class="step"><small>${esc(title)}</small><b>${esc(main)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div>`;
}
function jobCard(j) {
  const s = j.stats || {};
  const p = s.progress || {};
  let body = "";
  if (j.status === "running" || j.status === "queued") {
    const pct = p.files_total ? Math.round(100 * p.files_done / p.files_total) : 5;
    body = `<div class="bar" style="margin-top:9px"><div style="width:${pct}%"></div></div>
      <div class="meta" style="margin-top:5px">${p.files_total ? `${p.files_done}/${p.files_total} dosya` : "başlıyor…"} · ${s.chunks_written ?? 0} chunk yazıldı</div>`;
  } else if (j.status === "failed") {
    body = `<div class="errtxt">${esc(j.error)}</div>`;
  } else if (j.status === "done") {
    body = `<div class="flow">
      ${step("kaynak", s.commit ? s.commit.slice(0, 8) : "yerel", s.forced ? "tam yeniden index" : "artımlı")}
      <span class="arrow">→</span>
      ${step("fark", `+${s.added ?? 0} ~${s.modified ?? 0} −${s.deleted ?? 0}`, `${s.unchanged ?? 0} aynı · ${s.skipped ?? 0} atlandı`)}
      <span class="arrow">→</span>
      ${step("chunk", `${s.chunks_written ?? 0} yazıldı`, s.redactions ? `${s.redactions} karartma` : " ")}
      <span class="arrow">→</span>
      ${step("embed", `${s.embed_seconds ?? 0} sn`, " ")}
      <span class="arrow">→</span>
      ${step("Milvus", "✓", `toplam ${s.total_seconds ?? 0} sn`)}
    </div>`;
  }
  const when = (j.created_at || "").slice(5, 16).replace("T", " ");
  return `<div class="job">
    <div class="head"><span class="badge st-${esc(j.status)}">${esc(j.status)}</span>
      <b>${esc(j.repo_id)}</b>
      <span class="badge trigger-${esc(j.trigger)}">${esc(j.trigger)}</span>
      <span class="when">${esc(when)}</span></div>
    ${body}
    <details><summary>ham istatistik</summary><pre>${esc(JSON.stringify(j, null, 2))}</pre></details>
  </div>`;
}
async function loadJobs() {
  try {
    const repo = $("jobRepo").value;
    const jobs = await api("/jobs?limit=30" + (repo ? "&repo_id=" + encodeURIComponent(repo) : ""));
    $("jobs").innerHTML = jobs.length ? jobs.map(jobCard).join("") : `<div class="empty">Henüz iş yok — bir repo bağlayınca ilk index çalışması burada akar.</div>`;
  } catch (e) { toast("işler yüklenemedi: " + e.message); }
}

// ----------------------------------------------------------------- bağlan
function copyText(btn) {
  navigator.clipboard.writeText(btn.dataset.copy).then(() => {
    const old = btn.textContent; btn.textContent = "✓"; setTimeout(() => (btn.textContent = old), 1200);
  });
}
function copyRow(value) {
  return `<div class="copyrow"><code>${esc(value)}</code><button data-copy="${esc(value)}" onclick="copyText(this)">kopyala</button></div>`;
}
function renderConnect() {
  const h = window._health || {};
  const origin = location.origin;
  const gh = repos.filter(r => r.provider === "github" && r.web_url);
  const az = repos.filter(r => r.provider === "azure" && r.web_url);
  const parts = [];
  if (h.webhook_secret_set === false) {
    parts.push(`<div class="warnbox">⚠ <b>RAG_WEBHOOK_SECRET ayarlanmamış</b> — gelen webhook'lar 401 ile reddedilir. <code>.env</code>'e bir sır yazıp servisi yeniden başlat.</div>`);
  }
  parts.push(`<h3><span class="no">1</span>Push webhook'ları — repo değişince otomatik tazeleme</h3>
    <p><b>GitHub:</b> repo → Settings → Webhooks → <i>Add webhook</i>. Payload URL:</p>
    ${copyRow(origin + "/webhooks/github/push")}
    <p class="note">Content type <code>application/json</code> · Secret = <code>RAG_WEBHOOK_SECRET</code> (HMAC-SHA256 doğrulanır) · "Just the push event". Teslimatları repo'daki <i>Recent Deliveries</i> sekmesinden izlersin; ping'e servis <code>pong</code> döner.</p>
    ${gh.length ? `<p class="note">Kayıtlı GitHub repoların: ${gh.map(r => `<a href="${esc(r.web_url)}/settings/hooks" target="_blank" rel="noopener">${esc(r.name)} ↗</a>`).join(" · ")}</p>` : ""}
    <p style="margin-top:12px"><b>Azure DevOps:</b> Project Settings → Service Hooks → <i>Web Hooks</i> → olay <i>Code pushed</i>. URL:</p>
    ${copyRow(origin + "/webhooks/azure/push")}
    <p class="note">"Basic authentication password" ya da <code>X-RAG-Webhook-Secret</code> header'ı = <code>RAG_WEBHOOK_SECRET</code>. Aynı commit iki kez gelirse ikinci iş açılmaz.</p>
    ${az.length ? `<p class="note">Kayıtlı Azure repoların: ${az.map(r => `<a href="${esc(r.web_url.split("/_git/")[0])}/_settings/serviceHooks" target="_blank" rel="noopener">${esc(r.name)} ↗</a>`).join(" · ")}</p>` : ""}`);
  parts.push(`<h3><span class="no">2</span>Poller — webhook'suz yedek</h3>
    <p>${h.poll_interval_seconds ? `Her <b>${h.poll_interval_seconds} sn</b>'de bir Azure/GitHub branch head'i son indexlenen commit'le karşılaştırılır; webhook kuramasan bile index en geç bu aralıkta tazelenir. (<code>RAG_POLL_INTERVAL_SECONDS</code>, 0 = kapalı)` : `Kapalı (<code>RAG_POLL_INTERVAL_SECONDS=0</code>). Webhook yoksa tazeleme yalnızca <i>Güncelle</i> düğmesiyle olur.`}</p>`);
  parts.push(`<h3><span class="no">3</span>HTTP API</h3>
    <p>Tüm uçlar ve şemalar: <a href="/docs" target="_blank">/docs</a> (OpenAPI). En çok kullanılan ikisi:</p>
    ${copyRow(`curl -X POST ${origin}/search -H 'content-type: application/json' -d '{"q":"jwt nerede üretiliyor","k":8}'`)}
    ${copyRow(`curl '${origin}/repos/<repo-id>/file?path=src/index.ts&start=1&end=120'`)}
    <p class="note">Her arama sonucu kanal skorlarını taşır (dense/bm25/rrf/rerank) — hangi kanalın neyi bulduğu görünür.</p>`);
  parts.push(`<h3><span class="no">4</span>MCP / agent entegrasyonu</h3>
    <p>Bir asistana bağlamak için iki araç yeter: <code>search_code</code> → <code>POST /search</code>, <code>read_code</code> → <code>GET /repos/{id}/file</code>. Milvus API'nin MCP sunucusunda bu araçlar hazır; api tarafında tek ayar:</p>
    ${copyRow("RAG_SERVICE_URL=" + origin)}
    <p class="note">Dönen kod parçaları ajana <i>untrusted veri</i> olarak işaretlenip verilir (prompt-injection koruması). Başka bir MCP istemcisi ya da agent framework'ü de aynı iki HTTP ucunu sararak bağlanabilir. Bu servisin kendi kimlik doğrulaması yok — URL'i iç ağda tut (bkz. DEPLOYMENT.md).</p>`);
  $("connect").innerHTML = parts.join("");
}

loadHealth(); loadRepos();
// ?q= ve ?tab= ile paylaşılabilir görünümler.
const params = new URLSearchParams(location.search);
const startTab = params.get("tab");
showTab(["repolar", "isler", "baglan"].includes(startTab) ? startTab : "ara");
if (params.get("add")) { showTab("repolar"); $("btnAddRepo").click(); }
if (params.get("q")) {
  $("q").value = params.get("q");
  if (params.get("mode")) $("mode").value = params.get("mode");
  doSearch();
}
</script>
