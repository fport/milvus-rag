<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-label="Milvus RAG flow: push, tree-sitter chunk, BGE-M3 + BM25 into Milvus, an agent that knows your code over MCP + RAG">
  <!-- Anlatı hero'su, tek 10 sn'lik döngü: commit darbesi dosyayı chunk'lara böler,
       chunk'lar vektör kümesine (Milvus) akar, Türkçe sorgu kümeye gidip skorlu
       hit'leri geri getirir. JS yok — GitHub <img> içinde yalnızca SMIL/CSS çalışır. -->
  <defs>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3bf66b" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#29b34e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#29b34e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#dcebe1" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#dcebe1" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .label { font-size: 15px; fill: #7d9385; opacity: 0.9; }
      @media (prefers-reduced-motion: reduce) { .motion { display: none } }
    </style>
  </defs>

  <rect width="1600" height="420" fill="#070b09"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <ellipse cx="950" cy="190" rx="480" ry="240" fill="url(#glowGreen)"/>
  <ellipse cx="1150" cy="340" rx="320" ry="180" fill="url(#glowBlue)"/>
  <rect x="430" y="-60" width="300" height="560" fill="url(#sheen)" transform="skewX(-14)"/>

  <!-- uzak, sönük yıldızlar -->
  <g fill="#3bf66b" opacity="0.35">
    <circle cx="95" cy="120" r="2"/>
    <circle cx="700" cy="75" r="1.5"/>
    <circle cx="1180" cy="95" r="1.5"/>
    <circle cx="1560" cy="110" r="2"/>
  </g>

  <!-- ═ Sahne 1: git push ═ -->
  <g stroke="#2a4033" stroke-width="2" fill="none">
    <path d="M 210 115 V 305"/>
    <path d="M 255 270 C 255 245 210 250 210 228"/>
  </g>
  <circle cx="210" cy="290" r="4" fill="#29b34e" opacity="0.5"/>
  <circle cx="255" cy="270" r="3.5" fill="#29b34e" opacity="0.6"/>
  <circle cx="210" cy="225" r="4" fill="#29b34e" opacity="0.75"/>
  <circle cx="210" cy="150" r="5" fill="#3bf66b"/>
  <circle class="motion" cx="210" cy="150" fill="none" stroke="#3bf66b" stroke-width="1.5">
    <animate attributeName="r" dur="10s" repeatCount="indefinite" values="5;18;18" keyTimes="0;0.08;1"/>
    <animate attributeName="stroke-opacity" dur="10s" repeatCount="indefinite" values="0.6;0;0" keyTimes="0;0.08;1"/>
  </circle>
  <text class="label" x="210" y="348" text-anchor="middle">push</text>

  <!-- push → dosya bağlantısı ve darbe -->
  <path d="M 218 152 C 300 165 340 180 398 195" fill="none" stroke="#3bf66b" stroke-opacity="0.2" stroke-width="1.2"/>
  <circle class="motion" r="3" fill="#dcebe1" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.06;0.16;1" path="M 218 152 C 300 165 340 180 398 195"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.06;0.07;0.15;0.16;1"/>
  </circle>

  <!-- ═ Sahne 2: dosya → tree-sitter chunk ═ -->
  <rect x="400" y="135" width="120" height="150" rx="10" fill="#0d1410" stroke="#2a4033" stroke-width="1.5"/>
  <g rx="2.5">
    <rect x="416" y="153" width="72" height="5" rx="2.5" fill="#29b34e" opacity="0.9"/>
    <rect x="416" y="173" width="52" height="5" rx="2.5" fill="#566b5e" opacity="0.8"/>
    <rect x="416" y="193" width="84" height="5" rx="2.5" fill="#566b5e" opacity="0.8"/>
    <rect x="416" y="213" width="44" height="5" rx="2.5" fill="#566b5e" opacity="0.8"/>
    <rect x="416" y="233" width="64" height="5" rx="2.5" fill="#566b5e" opacity="0.8"/>
    <rect x="416" y="253" width="56" height="5" rx="2.5" fill="#566b5e" opacity="0.8"/>
  </g>
  <rect class="motion" x="400" y="135" width="120" height="150" rx="10" fill="none" stroke="#3bf66b" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0;0.15;0.19;0.28;1"/>
  </rect>

  <g stroke="#3bf66b" stroke-opacity="0.2" stroke-width="1.2" fill="none">
    <path d="M 520 175 C 560 175 560 159 600 159"/>
    <path d="M 520 210 L 600 225"/>
    <path d="M 520 245 C 560 245 560 291 600 291"/>
  </g>
  <g>
    <rect x="600" y="135" width="72" height="48" rx="8" fill="#0d1410" stroke="#2a4033" stroke-width="1.5"/>
    <rect x="612" y="149" width="44" height="4" rx="2" fill="#566b5e" opacity="0.8"/>
    <rect x="612" y="162" width="30" height="4" rx="2" fill="#566b5e" opacity="0.8"/>
    <rect x="600" y="201" width="72" height="48" rx="8" fill="#0d1410" stroke="#2a4033" stroke-width="1.5"/>
    <rect x="612" y="215" width="44" height="4" rx="2" fill="#566b5e" opacity="0.8"/>
    <rect x="612" y="228" width="30" height="4" rx="2" fill="#566b5e" opacity="0.8"/>
    <rect x="600" y="267" width="72" height="48" rx="8" fill="#0d1410" stroke="#2a4033" stroke-width="1.5"/>
    <rect x="612" y="281" width="44" height="4" rx="2" fill="#566b5e" opacity="0.8"/>
    <rect x="612" y="294" width="30" height="4" rx="2" fill="#566b5e" opacity="0.8"/>
  </g>
  <rect class="motion" x="600" y="135" width="72" height="48" rx="8" fill="none" stroke="#3bf66b" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0;0.20;0.23;0.28;1"/>
  </rect>
  <rect class="motion" x="600" y="201" width="72" height="48" rx="8" fill="none" stroke="#3bf66b" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0;0.23;0.26;0.31;1"/>
  </rect>
  <rect class="motion" x="600" y="267" width="72" height="48" rx="8" fill="none" stroke="#3bf66b" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0;0.26;0.29;0.34;1"/>
  </rect>
  <text class="label" x="536" y="348" text-anchor="middle">tree-sitter chunk</text>

  <!-- chunk → küme yolları ve embed noktaları -->
  <g stroke="#3bf66b" stroke-opacity="0.12" stroke-width="1.2" fill="none">
    <path d="M 674 159 C 770 150 830 158 903 165"/>
    <path d="M 674 225 C 780 222 860 216 970 210"/>
    <path d="M 674 291 C 770 286 840 274 921 262"/>
  </g>
  <circle class="motion" r="2.5" fill="#dcebe1" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.30;0.40;1" path="M 674 159 C 770 150 830 158 903 165"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.30;0.31;0.39;0.40;1"/>
  </circle>
  <circle class="motion" r="2.5" fill="#dcebe1" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.33;0.43;1" path="M 674 225 C 780 222 860 216 970 210"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.33;0.34;0.42;0.43;1"/>
  </circle>
  <circle class="motion" r="2.5" fill="#dcebe1" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.36;0.46;1" path="M 674 291 C 770 286 840 274 921 262"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.36;0.37;0.45;0.46;1"/>
  </circle>

  <!-- ═ Sahne 3: vektör kümesi (Milvus) ═ -->
  <g stroke="#3bf66b" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M 980 210 L 905 165"/>
    <path d="M 980 210 L 925 262"/>
    <path d="M 980 210 L 1075 255"/>
    <path d="M 980 210 L 1012 178 L 1045 140"/>
    <path d="M 1045 140 L 995 115"/>
  </g>
  <g fill="#3bf66b">
    <circle cx="905" cy="165" r="4.5"/>
    <circle cx="925" cy="262" r="4"/>
    <circle cx="1045" cy="140" r="5">
      <animate attributeName="opacity" values="1;0.7;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1075" cy="255" r="4.5"/>
    <circle cx="995" cy="115" r="4"/>
    <circle cx="980" cy="210" r="8">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="1012" cy="178" r="2.5" fill="#dcebe1" opacity="0.9"/>
  <circle class="motion" cx="980" cy="210" fill="none" stroke="#3bf66b" stroke-width="1.5">
    <animate attributeName="r" dur="10s" repeatCount="indefinite" values="8;8;30;30" keyTimes="0;0.46;0.56;1"/>
    <animate attributeName="stroke-opacity" dur="10s" repeatCount="indefinite" values="0;0;0.5;0;0" keyTimes="0;0.45;0.47;0.56;1"/>
  </circle>
  <circle class="motion" cx="980" cy="210" fill="none" stroke="#dcebe1" stroke-width="1.5">
    <animate attributeName="r" dur="10s" repeatCount="indefinite" values="8;8;22;22" keyTimes="0;0.63;0.70;1"/>
    <animate attributeName="stroke-opacity" dur="10s" repeatCount="indefinite" values="0;0;0.6;0;0" keyTimes="0;0.62;0.64;0.70;1"/>
  </circle>
  <text class="label" x="980" y="348" text-anchor="middle">BGE-M3 + BM25 → Milvus</text>

  <!-- ═ Sahne 4: Türkçe sorgu ve skorlu hit'ler ═ -->
  <text x="1233" y="148" font-size="16" fill="#dcebe1" opacity="0.95">&gt; <tspan fill="#3bf66b" font-weight="600">MCP + RAG</tspan> · knows your code</text>
  <rect class="motion" x="1546" y="134" width="8" height="16" fill="#3bf66b">
    <animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.5"/>
  </rect>
  <path d="M 1230 160 C 1140 180 1090 195 990 210" fill="none" stroke="#3bf66b" stroke-opacity="0.15" stroke-width="1.2"/>
  <circle class="motion" r="3" fill="#dcebe1" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.63;1" path="M 1230 160 C 1140 180 1090 195 990 210"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.55;0.56;0.62;0.63;1"/>
  </circle>

  <!-- sonuç satırları -->
  <g>
    <rect x="1240" y="200" width="300" height="26" rx="6" fill="#0d1410" stroke="#2a4033" stroke-width="1.5"/>
    <rect x="1248" y="206" width="3" height="14" rx="1.5" fill="#3bf66b"/>
    <text x="1260" y="217" font-size="13" fill="#7d9385">webhooks.py · handle_push</text>
    <rect x="1482" y="209" width="46" height="8" rx="4" fill="#3bf66b" opacity="0.75"/>

    <rect x="1240" y="236" width="300" height="26" rx="6" fill="#0d1410" stroke="#2a4033" stroke-width="1.5"/>
    <rect x="1248" y="242" width="3" height="14" rx="1.5" fill="#ffc24b"/>
    <text x="1260" y="253" font-size="13" fill="#7d9385">jobs.py · enqueue</text>
    <rect x="1492" y="245" width="36" height="8" rx="4" fill="#ffc24b" opacity="0.7"/>

    <rect x="1240" y="272" width="300" height="26" rx="6" fill="#0d1410" stroke="#2a4033" stroke-width="1.5"/>
    <rect x="1248" y="278" width="3" height="14" rx="1.5" fill="#3bf66b"/>
    <text x="1260" y="289" font-size="13" fill="#7d9385">db.py · webhook_events</text>
    <rect x="1504" y="281" width="24" height="8" rx="4" fill="#3bf66b" opacity="0.75"/>
  </g>

  <!-- küme → sonuç dönüş noktaları ve satır parlamaları -->
  <circle class="motion" r="2.5" fill="#3bf66b" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.66;0.73;1" path="M 990 210 C 1090 202 1160 210 1244 212"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.66;0.67;0.72;0.73;1"/>
  </circle>
  <circle class="motion" r="2.5" fill="#ffc24b" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.69;0.76;1" path="M 990 210 C 1090 215 1160 240 1244 248"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.69;0.70;0.75;0.76;1"/>
  </circle>
  <circle class="motion" r="2.5" fill="#3bf66b" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.72;0.79;1" path="M 990 210 C 1080 225 1160 270 1244 284"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.72;0.73;0.78;0.79;1"/>
  </circle>
  <rect class="motion" x="1240" y="200" width="300" height="26" rx="6" fill="none" stroke="#3bf66b" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0;0.73;0.76;0.86;1"/>
  </rect>
  <rect class="motion" x="1240" y="236" width="300" height="26" rx="6" fill="none" stroke="#ffc24b" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0;0.76;0.79;0.89;1"/>
  </rect>
  <rect class="motion" x="1240" y="272" width="300" height="26" rx="6" fill="none" stroke="#3bf66b" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0;0.79;0.82;0.92;1"/>
  </rect>
  <text class="label" x="1380" y="348" text-anchor="middle">8 hits · with channel scores</text>
</svg>
